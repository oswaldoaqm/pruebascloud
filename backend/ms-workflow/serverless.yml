org: oswaldoaqm
service: ms-workflow

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: dev
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  httpApi:
    cors: true
    authorizers:
      jwtAuth:
        type: request
        functionName: authorizer
        enableSimpleResponses: true
        identitySource: $request.header.Authorization
  environment:
    STAGE: ${sls:stage}
    WORKFLOW_TABLE: t_workflow-${sls:stage}
    EVENT_BUS: pedidos-bus
    STATE_MACHINE_ARN: arn:aws:states:us-east-1:${aws:accountId}:stateMachine:pedido-workflow-${sls:stage}
    JWT_SECRET: ${file(../shared-config.yml):jwtSecret}
    RAPPI_API_KEY: ${file(../shared-config.yml):rappiApiKey}
    # URL de la API-2 (Rappi Status) en OCI; vacía hasta desplegarla (la Lambda lo tolera)
    RAPPI_STATUS_URL: ${file(../shared-config.yml):rappiStatusUrl, ''}

functions:
  authorizer:
    handler: authorizer.handler

  # EDA: order.placed → inicia la ejecución del workflow
  startWorkflow:
    handler: workflow.start_workflow
    events:
      - eventBridge:
          eventBus: arn:aws:events:us-east-1:${aws:accountId}:event-bus/pedidos-bus
          pattern:
            source:
              - ms.pedidos
            detail-type:
              - order.placed

  # Invocada por Step Functions con waitForTaskToken: guarda el token y pausa el flujo
  asignarTarea:
    handler: workflow.asignar_tarea

  # Invocada por Step Functions al final: publica order.completed
  finalizar:
    handler: workflow.finalizar

  # Invocada si un paso falla o expira (timeout 24h): publica order.failed
  fallar:
    handler: workflow.fallar

  # Multi-nube EDA: si el pedido vino de Rappi, cada cambio de estado
  # se notifica a la API-2 en GCP (filtro origin=RAPPI en la regla)
  notifyRappi:
    handler: workflow.notify_rappi
    events:
      - eventBridge:
          eventBus: arn:aws:events:us-east-1:${aws:accountId}:event-bus/pedidos-bus
          pattern:
            source:
              - ms.workflow
            detail-type:
              - order.step.changed
              - order.completed
              - order.failed
            detail:
              origin:
                - RAPPI

  listarTareas:
    handler: tareas.listar
    events:
      - httpApi:
          path: /tareas
          method: get
          authorizer:
            name: jwtAuth

  tomarTarea:
    handler: tareas.tomar
    events:
      - httpApi:
          path: /tareas/{order_id}/{paso}/tomar
          method: post
          authorizer:
            name: jwtAuth

  completarTarea:
    handler: tareas.completar
    events:
      - httpApi:
          path: /tareas/{order_id}/{paso}/completar
          method: post
          authorizer:
            name: jwtAuth

  timeline:
    handler: tareas.timeline
    events:
      - httpApi:
          path: /tareas/{order_id}
          method: get
          authorizer:
            name: jwtAuth

  dashboard:
    handler: tareas.dashboard
    events:
      - httpApi:
          path: /dashboard
          method: get
          authorizer:
            name: jwtAuth

resources:
  Resources:
    WorkflowTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_workflow-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    OrderStateMachine:
      Type: AWS::StepFunctions::StateMachine
      DependsOn:
        - AsignarTareaLambdaFunction
        - FinalizarLambdaFunction
        - FallarLambdaFunction
      Properties:
        StateMachineName: pedido-workflow-${sls:stage}
        StateMachineType: STANDARD
        RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
        DefinitionString: |
          {
            "Comment": "Workflow de pedido Papa Johns con Wait for Callback (Task Token)",
            "StartAt": "EsperarCocina",
            "States": {
              "EsperarCocina": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:us-east-1:${aws:accountId}:function:ms-workflow-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id",
                    "order_id.$": "$.order_id",
                    "origin.$": "$.origin",
                    "paso": "COCINAR",
                    "status_pedido": "COOKING",
                    "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null,
                "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "EsperarEmpaque"
              },
              "EsperarEmpaque": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:us-east-1:${aws:accountId}:function:ms-workflow-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id",
                    "order_id.$": "$.order_id",
                    "origin.$": "$.origin",
                    "paso": "EMPACAR",
                    "status_pedido": "PACKING",
                    "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null,
                "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "EsperarReparto"
              },
              "EsperarReparto": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:us-east-1:${aws:accountId}:function:ms-workflow-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id",
                    "order_id.$": "$.order_id",
                    "origin.$": "$.origin",
                    "paso": "REPARTIR",
                    "status_pedido": "DELIVERING",
                    "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null,
                "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "EsperarEntrega"
              },
              "EsperarEntrega": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:us-east-1:${aws:accountId}:function:ms-workflow-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id",
                    "order_id.$": "$.order_id",
                    "origin.$": "$.origin",
                    "paso": "ENTREGAR",
                    "status_pedido": "DELIVERING",
                    "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null,
                "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "Finalizar"
              },
              "Finalizar": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:us-east-1:${aws:accountId}:function:ms-workflow-${sls:stage}-finalizar",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id",
                    "order_id.$": "$.order_id",
                    "origin.$": "$.origin"
                  }
                },
                "End": true
              },
              "NotificarFallo": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:us-east-1:${aws:accountId}:function:ms-workflow-${sls:stage}-fallar",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id",
                    "order_id.$": "$.order_id",
                    "origin.$": "$.origin"
                  }
                },
                "Next": "PedidoFallido"
              },
              "PedidoFallido": {
                "Type": "Fail",
                "Error": "PedidoFallido",
                "Cause": "Timeout o error en una tarea humana"
              }
            }
          }
