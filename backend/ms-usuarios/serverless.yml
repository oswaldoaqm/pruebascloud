org: oswaldoaqm
service: ms-usuarios

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: dev
  # Learner Lab no permite crear roles IAM: se reutiliza LabRole
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  httpApi:
    cors: true
    authorizers:
      jwtAuth:
        type: request
        functionName: authorizer
        enableSimpleResponses: true
        identitySource: $request.header.Authorization
  environment:
    STAGE: ${sls:stage}
    USERS_TABLE: t_usuarios-${sls:stage}
    JWT_SECRET: ${file(../shared-config.yml):jwtSecret}

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /hello
          method: get

  authorizer:
    handler: authorizer.handler

  register:
    handler: auth.register
    events:
      - httpApi:
          path: /auth/register
          method: post

  login:
    handler: auth.login
    events:
      - httpApi:
          path: /auth/login
          method: post

  me:
    handler: auth.me
    events:
      - httpApi:
          path: /auth/me
          method: get
          authorizer:
            name: jwtAuth

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_usuarios-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

  Outputs:
    AuthorizerArn:
      Description: ARN del authorizer para reutilizar en otros microservicios
      Value: !GetAtt AuthorizerLambdaFunction.Arn
      Export:
        Name: ms-usuarios-${sls:stage}-authorizer-arn
