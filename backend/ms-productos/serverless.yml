org: oswaldoaqm
service: ms-productos

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: dev
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  httpApi:
    cors: true
    authorizers:
      jwtAuth:
        type: request
        functionName: authorizer
        enableSimpleResponses: true
        identitySource: $request.header.Authorization
  environment:
    STAGE: ${sls:stage}
    PRODUCTS_TABLE: t_productos-${sls:stage}
    IMAGES_BUCKET: pj-grupo2-imagenes-${aws:accountId}
    # Mismo secreto en todos los microservicios (archivo compartido, fuera del repo)
    JWT_SECRET: ${file(../shared-config.yml):jwtSecret}

functions:
  authorizer:
    handler: authorizer.handler

  listarProductos:
    handler: productos.listar
    events:
      - httpApi:
          path: /productos
          method: get

  crearProducto:
    handler: productos.crear
    events:
      - httpApi:
          path: /productos
          method: post
          authorizer:
            name: jwtAuth

  seed:
    handler: productos.seed
    timeout: 30

resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_productos-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: pj-grupo2-imagenes-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/*'
