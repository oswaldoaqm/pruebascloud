org: oswaldoaqm
service: pedidos-pj

# ─────────────────────────────────────────────────────────────────────────────
# UN SOLO servicio = UNA SOLA API Gateway (HTTP API) + UN SOLO deploy.
# Los "microservicios" se mantienen como dominios lógicos, cada uno con su
# propia tabla DynamoDB y sus propios handlers:
#   usuarios · productos · pedidos · workflow
# Se comunican por eventos (EventBridge) → arquitectura event-driven.
# ─────────────────────────────────────────────────────────────────────────────

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: dev
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  httpApi:
    cors: true
    authorizers:
      jwtAuth:
        type: request
        functionName: authorizer
        enableSimpleResponses: true
        identitySource: $request.header.Authorization
  environment:
    STAGE: ${sls:stage}
    USERS_TABLE: t_usuarios-${sls:stage}
    PRODUCTS_TABLE: t_productos-${sls:stage}
    ORDERS_TABLE: t_pedidos-${sls:stage}
    WORKFLOW_TABLE: t_workflow-${sls:stage}
    SEDES_TABLE: t_sedes-${sls:stage}
    IMAGES_BUCKET: pj-grupo2-imagenes-${aws:accountId}
    EVENT_BUS: pedidos-bus
    STATE_MACHINE_ARN: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:pedido-workflow-${sls:stage}
    RAPPI_COLA_URL: https://sqs.${aws:region}.amazonaws.com/${aws:accountId}/rappi-cola-${sls:stage}
    SNS_TOPIC_ARN: arn:aws:sns:${aws:region}:${aws:accountId}:pedidos-notificaciones-${sls:stage}
    JWT_SECRET: ${file(shared-config.yml):jwtSecret}
    RAPPI_API_KEY: ${file(shared-config.yml):rappiApiKey}
    RAPPI_STATUS_URL: ${file(shared-config.yml):rappiStatusUrl, ''}

functions:
  # ── Authorizer compartido por toda la API ──
  authorizer:
    handler: authorizer.handler

  # ── Dominio: usuarios ──
  register:
    handler: usuarios.register
    events:
      - httpApi: { path: /auth/register, method: post }
  login:
    handler: usuarios.login
    events:
      - httpApi: { path: /auth/login, method: post }
  me:
    handler: usuarios.me
    events:
      - httpApi: { path: /auth/me, method: get, authorizer: { name: jwtAuth } }
  seedUsuarios:
    handler: usuarios.seed_usuarios
    timeout: 30
  listarUsuarios:
    handler: usuarios.listar_usuarios
    events:
      - httpApi: { path: /usuarios, method: get, authorizer: { name: jwtAuth } }
  crearUsuario:
    handler: usuarios.crear_usuario
    events:
      - httpApi: { path: /usuarios, method: post, authorizer: { name: jwtAuth } }
  actualizarUsuario:
    handler: usuarios.actualizar_usuario
    events:
      - httpApi: { path: '/usuarios/{email}', method: patch, authorizer: { name: jwtAuth } }
  eliminarUsuario:
    handler: usuarios.eliminar_usuario
    events:
      - httpApi: { path: '/usuarios/{email}', method: delete, authorizer: { name: jwtAuth } }

  # ── Dominio: productos ──
  listarProductos:
    handler: productos.listar
    events:
      - httpApi: { path: /productos, method: get }
  crearProducto:
    handler: productos.crear
    events:
      - httpApi: { path: /productos, method: post, authorizer: { name: jwtAuth } }
  actualizarProducto:
    handler: productos.actualizar
    events:
      - httpApi: { path: '/productos/{product_id}', method: patch, authorizer: { name: jwtAuth } }
  eliminarProducto:
    handler: productos.eliminar
    events:
      - httpApi: { path: '/productos/{product_id}', method: delete, authorizer: { name: jwtAuth } }
  seedProductos:
    handler: productos.seed
    timeout: 30

  # ── Dominio: sedes (cadena) ──
  listarSedes:
    handler: sedes.listar
    events:
      - httpApi: { path: /sedes, method: get }
  crearSede:
    handler: sedes.crear
    events:
      - httpApi: { path: /sedes, method: post, authorizer: { name: jwtAuth } }
  actualizarSede:
    handler: sedes.actualizar
    events:
      - httpApi: { path: '/sedes/{id}', method: patch, authorizer: { name: jwtAuth } }
  metricasSedes:
    handler: sedes.metricas
    events:
      - httpApi: { path: /sedes/metricas, method: get, authorizer: { name: jwtAuth } }
  seedSedes:
    handler: sedes.seed
    timeout: 30

  # ── Dominio: pedidos ──
  crearPedido:
    handler: pedidos.crear
    events:
      - httpApi: { path: /pedidos, method: post, authorizer: { name: jwtAuth } }
  crearPedidoRappi:
    handler: pedidos.crear_rappi
    events:
      - httpApi: { path: /pedidos/rappi, method: post }
  obtenerPedido:
    handler: pedidos.obtener
    events:
      - httpApi: { path: '/pedidos/{order_id}', method: get, authorizer: { name: jwtAuth } }
  listarPedidos:
    handler: pedidos.listar
    events:
      - httpApi: { path: /pedidos, method: get, authorizer: { name: jwtAuth } }
  actualizarStatus:
    handler: pedidos.actualizar_status
    events:
      - eventBridge:
          eventBus: pedidos-bus
          pattern:
            source: [ms.workflow]
            detail-type: [order.step.changed, order.completed, order.failed]
          deadLetterQueueArn: { Fn::GetAtt: [EventosDLQ, Arn] }   # DLQ: no perder eventos
          retryPolicy: { maximumRetryAttempts: 3 }

  # ── Dominio: workflow (Step Functions + tareas humanas) ──
  startWorkflow:
    handler: workflow.start_workflow
    events:
      - eventBridge:
          eventBus: pedidos-bus
          pattern:
            source: [ms.pedidos]
            detail-type: [order.placed]
          deadLetterQueueArn: { Fn::GetAtt: [EventosDLQ, Arn] }   # DLQ: no perder eventos
          retryPolicy: { maximumRetryAttempts: 3 }
  asignarTarea:
    handler: workflow.asignar_tarea
  finalizar:
    handler: workflow.finalizar
  fallar:
    handler: workflow.fallar
  cancelarPedido:
    handler: workflow.cancelar
    events:
      - httpApi: { path: '/pedidos/{order_id}/cancelar', method: post, authorizer: { name: jwtAuth } }
  # EDA→SQS: encola las notificaciones a Rappi (amortigua la dependencia de OCI)
  encolarRappi:
    handler: workflow.encolar_rappi
    events:
      - eventBridge:
          eventBus: pedidos-bus
          pattern:
            source: [ms.workflow]
            detail-type: [order.step.changed, order.completed, order.failed]
            detail:
              origin: [RAPPI]
          deadLetterQueueArn: { Fn::GetAtt: [EventosDLQ, Arn] }
          retryPolicy: { maximumRetryAttempts: 3 }
  # Consumidor de la cola SQS: llama a OCI; si falla, reintenta y cae a la DLQ
  notifyRappi:
    handler: workflow.notify_rappi
    timeout: 15
    events:
      - sqs:
          arn: { Fn::GetAtt: [RappiCola, Arn] }
          batchSize: 1
  # SNS: notificación saliente al cliente (pub/sub) al entregar o cancelar
  notificarCliente:
    handler: workflow.notificar_cliente
    events:
      - eventBridge:
          eventBus: pedidos-bus
          pattern:
            source: [ms.workflow]
            detail-type: [order.completed, order.failed]
  listarTareas:
    handler: tareas.listar
    events:
      - httpApi: { path: /tareas, method: get, authorizer: { name: jwtAuth } }
  tomarTarea:
    handler: tareas.tomar
    events:
      - httpApi: { path: '/tareas/{order_id}/{paso}/tomar', method: post, authorizer: { name: jwtAuth } }
  completarTarea:
    handler: tareas.completar
    events:
      - httpApi: { path: '/tareas/{order_id}/{paso}/completar', method: post, authorizer: { name: jwtAuth } }
  timeline:
    handler: tareas.timeline
    events:
      - httpApi: { path: '/tareas/{order_id}', method: get, authorizer: { name: jwtAuth } }
  dashboard:
    handler: tareas.dashboard
    events:
      - httpApi: { path: /dashboard, method: get, authorizer: { name: jwtAuth } }

resources:
  Resources:
    # ── Mensajería asíncrona: SQS (amortiguador + DLQ) y SNS (notificaciones) ──
    RappiDLQ:                       # cae aquí lo que falla tras 3 intentos contra OCI
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rappi-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600   # 14 días
    RappiCola:                      # cola amortiguadora delante de OCI/Rappi
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rappi-cola-${sls:stage}
        VisibilityTimeout: 90
        RedrivePolicy:
          deadLetterTargetArn: { Fn::GetAtt: [RappiDLQ, Arn] }
          maxReceiveCount: 3
    EventosDLQ:                     # DLQ para los consumidores internos de EventBridge
      Type: AWS::SQS::Queue
      Properties:
        QueueName: eventos-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
    EventosDLQPolicy:               # permite a EventBridge depositar en la DLQ
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [ { Ref: EventosDLQ } ]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: { Fn::GetAtt: [EventosDLQ, Arn] }
    PedidosTopic:                   # SNS: notificaciones salientes (pub/sub)
      Type: AWS::SNS::Topic
      Properties:
        TopicName: pedidos-notificaciones-${sls:stage}
    PedidosTopicSub:                # suscripción por email (confirmar una vez)
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: { Ref: PedidosTopic }
        Protocol: email
        Endpoint: oswaldoaqm@gmail.com

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_usuarios-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK, AttributeType: S }
          - { AttributeName: SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }

    SedesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_sedes-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK, AttributeType: S }
          - { AttributeName: SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }

    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_productos-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK, AttributeType: S }
          - { AttributeName: SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_pedidos-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK, AttributeType: S }
          - { AttributeName: SK, AttributeType: S }
          - { AttributeName: GSI1PK, AttributeType: S }
          - { AttributeName: GSI1SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - { AttributeName: GSI1PK, KeyType: HASH }
              - { AttributeName: GSI1SK, KeyType: RANGE }
            Projection: { ProjectionType: ALL }

    WorkflowTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_workflow-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK, AttributeType: S }
          - { AttributeName: SK, AttributeType: S }
          - { AttributeName: GSI1PK, AttributeType: S }
          - { AttributeName: GSI1SK, AttributeType: S }
          - { AttributeName: GSI2PK, AttributeType: S }
          - { AttributeName: GSI2SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: GSI1   # cola FIFO por paso+estado
            KeySchema:
              - { AttributeName: GSI1PK, KeyType: HASH }
              - { AttributeName: GSI1SK, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - IndexName: GSI2   # dashboard por tenant (evita scan)
            KeySchema:
              - { AttributeName: GSI2PK, KeyType: HASH }
              - { AttributeName: GSI2SK, KeyType: RANGE }
            Projection: { ProjectionType: ALL }

    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: pj-grupo2-imagenes-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${ImagesBucket.Arn}/*'

    OrderStateMachine:
      Type: AWS::StepFunctions::StateMachine
      DependsOn:
        - AsignarTareaLambdaFunction
        - FinalizarLambdaFunction
        - FallarLambdaFunction
      Properties:
        StateMachineName: pedido-workflow-${sls:stage}
        StateMachineType: STANDARD
        RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
        DefinitionString: |
          {
            "Comment": "Workflow de pedido Papa Johns con Wait for Callback (Task Token)",
            "StartAt": "EsperarCocina",
            "States": {
              "EsperarCocina": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id", "order_id.$": "$.order_id", "origin.$": "$.origin",
                    "paso": "COCINAR", "status_pedido": "COOKING", "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null, "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "EsperarEmpaque"
              },
              "EsperarEmpaque": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id", "order_id.$": "$.order_id", "origin.$": "$.origin",
                    "paso": "EMPACAR", "status_pedido": "PACKING", "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null, "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "EsperarReparto"
              },
              "EsperarReparto": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id", "order_id.$": "$.order_id", "origin.$": "$.origin",
                    "paso": "REPARTIR", "status_pedido": "DELIVERING", "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null, "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "EsperarEntrega"
              },
              "EsperarEntrega": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-asignarTarea",
                  "Payload": {
                    "tenant_id.$": "$.tenant_id", "order_id.$": "$.order_id", "origin.$": "$.origin",
                    "paso": "ENTREGAR", "status_pedido": "DELIVERING", "task_token.$": "$$.Task.Token"
                  }
                },
                "ResultPath": null, "TimeoutSeconds": 86400,
                "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "NotificarFallo", "ResultPath": "$.error" }],
                "Next": "Finalizar"
              },
              "Finalizar": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-finalizar",
                  "Payload": { "tenant_id.$": "$.tenant_id", "order_id.$": "$.order_id", "origin.$": "$.origin" }
                },
                "End": true
              },
              "NotificarFallo": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-fallar",
                  "Payload": { "tenant_id.$": "$.tenant_id", "order_id.$": "$.order_id", "origin.$": "$.origin" }
                },
                "Next": "PedidoFallido"
              },
              "PedidoFallido": {
                "Type": "Fail", "Error": "PedidoFallido",
                "Cause": "Timeout o error en una tarea humana"
              }
            }
          }
